# Auteur de brunch-story.fr — multilingue FR/EN
#
# Hugo lit ce fichier nativement via `.Site.Data.authors` dans les templates.
#
# Structure : map d'auteurs indexee par ID (slug).
# L'ID est utilise dans le frontmatter des articles comme `author: bastien-delorme`.
# Le champ `topics` sert a la selection automatique de l'auteur dans /create-article-geo.
# Le champ `expertise` alimente le schema.org Person -> knowsAbout.
#
# Ce blog n'a qu'un auteur, et le nom affiche est public et definitif : il est
# deja engage par les articles publies. Ne pas ajouter d'autre signature.

bastien-delorme:
  id: bastien-delorme
  name: Bastien Delorme
  type: person
  # Avatar a generer (WebP 512x512, flat illustration portrait), prompt dans
  # .claude/templates/data/avatar-prompts.md. Laisse VIDE tant que le fichier
  # n'existe pas : le theme affiche alors un placeholder propre, alors qu'un
  # chemin renseigne mais absent sort une image 404 dans le schema.org Person.
  # A remettre a /images/authors/bastien-delorme.webp une fois le fichier depose.
  avatar: ""
  linkedinUrl: ""
  jobTitle:
    fr: Chroniqueur brunch et petit déjeuner
    en: Brunch and breakfast writer
  role:
    fr: Chroniqueur brunch et petit déjeuner
    en: Brunch and breakfast writer
  bio:
    fr: "Bastien Delorme bruncherait tous les week-ends s'il pouvait. Il teste les adresses de sa ville, refait chez lui ce qui l'a marqué, et s'intéresse autant à ce qu'il y a dans l'assiette qu'au café qui l'accompagne."
    en: "Bastien Delorme would brunch every weekend if he could. He tries out the places in his city, recreates at home whatever stuck with him, and cares as much about what is on the plate as about the coffee that goes with it."
  expertise:
    - Brunch
    - Petit déjeuner salé et sucré
    - Pancakes et œufs
    - Cafés de spécialité
    - Adresses et formules
  topics:
    - brunch
    - petit déjeuner
    - pancakes
    - œufs brouillés
    - œufs bénédicte
    - avocado toast
    - granola
    - porridge
    - viennoiserie
    - café
    - cappuccino
    - café filtre
    - torréfaction
    - formule brunch
    - week-end
